[project]
name = "story-board"
version = "0.1.2"
description = ""
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Josh Weaver", email = "nunyabusiness@gmail.com" },
    { name = "Cory Malichar", email = "nunyabusiness@gmail.com" }
]
dependencies = [
  "flet-quill @ git+https://github.com/jweaver11/Flet-Quill",
  "flet-color-pickers",
  "flet>=1.1.0",
  "flet-shadcn-ui",
  "flet-charts",
  "google-api-python-client",
  "google-auth-oauthlib",
  "Pillow",
  "python-docx"
]

[tool.flet]
# org name in reverse domain name notation, e.g. "com.mycompany".
# Combined with project.name to build bundle ID for iOS and Android apps
org = "com.mycompany"

# project display name that is used as an app title on Android and iOS home screens,
# shown in window titles and about app dialogs on desktop.
product = "Story Board"

# company name to display in about app dialogs
company = "Flet"

# copyright text to display in about app dialogs
copyright = "Copyright (C) 2025 by Flet"

[tool.flet.app]
path = "src"

# jni_flutter needs jni ^1.1.0 but pub resolved 1.0.0
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "^1.1.0"

# Fix build error for flet color pickers
[tool.flet.flutter.pubspec.dependency_overrides.flutter_colorpicker.git]
url = "https://github.com/flet-dev/flutter_colorpicker"
ref = "material-ui"

[tool.uv]
dev-dependencies = [
    "flet[all]==1.1.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
flet = {extras = ["all"], version = "1.1.0"}

[tool.flet.macos]
target_arch = ["arm64"]
icon_background = "#1c1c1c"